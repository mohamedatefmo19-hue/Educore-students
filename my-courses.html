<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · كورساتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1e33;
      display: flex;
      min-height: 100vh;
    }
    body.dark-mode { background: #0b0e14; color: #eef2f6; }

    .sidebar {
      width: 260px;
      background: #ffffff;
      border-left: 1px solid #e7edf5;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    body.dark-mode .sidebar { background: #141a26; border-left-color: #2a3442; }
    .sidebar.closed { transform: translateX(100%); }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: #2a7de1;
      background: #e8f0fe;
      padding: 0.6rem;
      border-radius: 14px;
    }
    body.dark-mode .sidebar-logo i { background: #1f2a40; color: #6b9ef0; }
    .sidebar-logo span { font-weight: 700; font-size: 1.5rem; }
    .sidebar-logo span small { color: #2a7de1; }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .sidebar nav a { color: #b0c0d4; }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #eef4fe;
      color: #1a67c4;
    }
    body.dark-mode .sidebar nav a:hover, body.dark-mode .sidebar nav a.active {
      background: #1f2a40;
      color: #6b9ef0;
    }
    .sidebar-footer {
      border-top: 1px solid #e7edf5;
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7d9c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    body.dark-mode .sidebar-footer { border-top-color: #2a3442; }
    .sidebar-footer:hover { color: #e74c3c; }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .sidebar-overlay.show { display: block; }

    .main {
      flex: 1;
      margin-right: 260px;
      padding: 1.8rem 2rem 2.5rem;
      transition: margin-right 0.3s ease;
      overflow-x: hidden;
      width: 100%;
    }
    .main.expanded { margin-right: 0; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions { display: flex; align-items: center; gap: 1.2rem; }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .navbar-actions button { color: #b0c0d4; }
    .navbar-actions button:hover { color: #2a7de1; }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: #2a7de1;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: #6b7d9c; }
    body.dark-mode .lang-dark .dark-toggle { color: #b0c0d4; }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .hamburger { color: #b0c0d4; }

    .search-box {
      position: relative;
      max-width: 350px;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      border: 1.5px solid #dfe6f0;
      border-radius: 40px;
      font-size: 0.9rem;
      background: #ffffff;
      color: #1a253a;
    }
    body.dark-mode .search-box input { background: #1a1f2b; border-color: #3b465b; color: #eef2f6; }
    .search-box input:focus { outline: none; border-color: #2a7de1; box-shadow: 0 0 0 3px rgba(42,125,225,0.1); }
    .search-box i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #8a9bb5;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .course-card {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #eef2f8;
      overflow: hidden;
      transition: 0.15s;
      cursor: pointer;
    }
    body.dark-mode .course-card { background: #1a1f2b; border-color: #2a3442; }
    .course-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .course-card .thumb {
      width: 100%;
      height: 140px;
      background: linear-gradient(135deg, #e8f0fe, #d0e0fc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #2a7de1;
    }
    body.dark-mode .course-card .thumb { background: linear-gradient(135deg, #1f2a40, #2a3a5a); color: #6b9ef0; }
    .course-card .body { padding: 1.2rem; }
    .course-card .title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
    .course-card .teacher-name { font-size: 0.85rem; color: #6b7d9c; margin-bottom: 0.5rem; }
    .course-card .tags {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      font-weight: 600;
    }
    .tag.subject { background: #e8f0fe; color: #1a67c4; }
    .tag.grade { background: #fef3e2; color: #b9770e; }
    .progress-section { margin-top: 0.5rem; }
    .progress-label { font-size: 0.75rem; color: #6b7d9c; margin-bottom: 0.3rem; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #eef2f8;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: #2a7de1; border-radius: 10px; transition: width 0.3s; }

    .empty-state { text-align: center; padding: 3rem; color: #8a9bb5; }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-weight: 500;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast { background: #2a3442; color: #eef2f6; }
    .toast.success { border-right: 4px solid #10B981; }
    .toast.error { border-right: 4px solid #EF4444; }
    @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .main { margin-right: 0; }
      .sidebar { transform: translateX(100%); }
      .sidebar.closed { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .courses-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">لوحة التحكم</span></a>
      <a href="browse-teachers.html"><i class="fas fa-users"></i> <span data-key="teachers">المدرسون</span></a>
      <a href="my-courses.html" class="active"><i class="fas fa-book-open"></i> <span data-key="courses">كورساتي</span></a>
      <a href="assignments.html"><i class="fas fa-tasks"></i> <span data-key="assignments">الواجبات</span></a>
      <a href="messages.html"><i class="fas fa-comments"></i> <span data-key="messages">الرسائل</span></a>
      <a href="profile.html"><i class="fas fa-user"></i> <span data-key="profile">الملف الشخصي</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">الإعدادات</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">تسجيل الخروج</span>
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">كورساتي</h1>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="ابحث عن كورس...">
        </div>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">AR</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <!-- قائمة الكورسات -->
    <div class="courses-grid" id="coursesGrid">
      <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>جاري تحميل كورساتك...</div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
      getFirestore, collection, getDocs, doc, getDoc, onSnapshot, query, orderBy
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOBJ22snwOow8xfQnL2WmCusmyS8iWWlk",
      authDomain: "educore-c3b42.firebaseapp.com",
      projectId: "educore-c3b42",
      storageBucket: "educore-c3b42.firebasestorage.app",
      messagingSenderId: "750509780814",
      appId: "1:750509780814:web:f57bddff39c7668b3cf81f",
      measurementId: "G-LF317C03Q0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let STUDENT_ID = '';
    let allEnrollments = [];

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      else {
        STUDENT_ID = user.uid;
        document.body.classList.add('auth-ready');
        listenToEnrollments();
      }
    });

    // Mobile sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => { if (window.innerWidth <= 768) { sidebar.classList.remove('open'); overlay.classList.remove('show'); } });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function listenToEnrollments() {
      const q = query(collection(db, 'students', STUDENT_ID, 'enrollments'), orderBy('joinedAt', 'desc'));
      onSnapshot(q, async (snapshot) => {
        allEnrollments = [];
        snapshot.forEach(doc => allEnrollments.push({ id: doc.id, ...doc.data() }));
        await loadCoursesDetails();
      }, (error) => {
        console.error(error);
        showToast('فشل تحميل البيانات', 'error');
        document.getElementById('coursesGrid').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>فشل تحميل الكورسات</div>';
      });
    }

    async function loadCoursesDetails() {
      const grid = document.getElementById('coursesGrid');

      if (allEnrollments.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-book-open"></i>
            <p>لم تنضم لأي كورس بعد</p>
            <a href="browse-teachers.html" style="color: #2a7de1; margin-top: 0.5rem; display: inline-block;">تصفح المدرسين</a>
          </div>`;
        return;
      }

      const coursesData = [];

      for (const enrollment of allEnrollments) {
        const { courseId, teacherId, progress } = enrollment;
        if (!teacherId || !courseId) continue;

        try {
          const courseDoc = await getDoc(doc(db, 'teachers', teacherId, 'courses', courseId));
          if (courseDoc.exists()) {
            const course = courseDoc.data();

            // جلب اسم المعلم
            let teacherName = 'مدرس';
            try {
              const prefsDoc = await getDoc(doc(db, 'teachers', teacherId, 'settings', 'preferences'));
              if (prefsDoc.exists()) teacherName = prefsDoc.data().name || 'مدرس';
            } catch (e) {}

            coursesData.push({
              id: courseId,
              teacherId,
              title: course.title || 'كورس بدون عنوان',
              description: course.description || '',
              subject: course.subject || '',
              grade: course.grade || '',
              price: course.price || 0,
              teacherName,
              progress: progress || 0
            });
          }
        } catch (e) {
          // تخطي الكورس الذي لا يمكن الوصول إليه
        }
      }

      // فلترة بالبحث
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = coursesData.filter(c =>
        c.title.toLowerCase().includes(searchTerm) ||
        c.teacherName.toLowerCase().includes(searchTerm) ||
        c.subject.toLowerCase().includes(searchTerm)
      );

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><br>لا توجد نتائج</div>';
        return;
      }

      grid.innerHTML = filtered.map(c => `
        <div class="course-card" onclick="window.location.href='course-details.html?id=${c.id}&teacher=${c.teacherId}'">
          <div class="thumb"><i class="fas fa-book-open"></i></div>
          <div class="body">
            <div class="title">${escapeHtml(c.title)}</div>
            <div class="teacher-name"><i class="fas fa-chalkboard-teacher"></i> ${escapeHtml(c.teacherName)}</div>
            <div class="tags">
              ${c.subject ? `<span class="tag subject">${c.subject}</span>` : ''}
              ${c.grade ? `<span class="tag grade">${c.grade}</span>` : ''}
            </div>
            <div class="progress-section">
              <div class="progress-label">${c.progress}% مكتمل</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${c.progress}%;"></div></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // البحث
    document.getElementById('searchInput').addEventListener('input', loadCoursesDetails);

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // اللغة والوضع الليلي
    let lang = 'ar';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');

    const translations = {
      ar: { dashboard: 'لوحة التحكم', teachers: 'المدرسون', courses: 'كورساتي', assignments: 'الواجبات', messages: 'الرسائل', profile: 'الملف الشخصي', settings: 'الإعدادات', logout: 'تسجيل الخروج', pageTitle: 'كورساتي' },
      en: { dashboard: 'Dashboard', teachers: 'Teachers', courses: 'My Courses', assignments: 'Assignments', messages: 'Messages', profile: 'Profile', settings: 'Settings', logout: 'Logout', pageTitle: 'My Courses' }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      darkToggle.innerHTML = document.body.classList.contains('dark-mode') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    applyLanguage('ar');
    console.log('✅ صفحة كورساتي جاهزة.');
  </script>
</body>
</html>
