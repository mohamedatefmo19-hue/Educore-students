<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · الرسائل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1e33;
      display: flex;
      min-height: 100vh;
    }
    body.dark-mode { background: #0b0e14; color: #eef2f6; }

    .sidebar {
      width: 260px;
      background: #ffffff;
      border-left: 1px solid #e7edf5;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    body.dark-mode .sidebar { background: #141a26; border-left-color: #2a3442; }
    .sidebar.closed { transform: translateX(100%); }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: #2a7de1;
      background: #e8f0fe;
      padding: 0.6rem;
      border-radius: 14px;
    }
    body.dark-mode .sidebar-logo i { background: #1f2a40; color: #6b9ef0; }
    .sidebar-logo span { font-weight: 700; font-size: 1.5rem; }
    .sidebar-logo span small { color: #2a7de1; }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .sidebar nav a { color: #b0c0d4; }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #eef4fe;
      color: #1a67c4;
    }
    body.dark-mode .sidebar nav a:hover, body.dark-mode .sidebar nav a.active {
      background: #1f2a40;
      color: #6b9ef0;
    }
    .sidebar-footer {
      border-top: 1px solid #e7edf5;
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7d9c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    body.dark-mode .sidebar-footer { border-top-color: #2a3442; }
    .sidebar-footer:hover { color: #e74c3c; }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .sidebar-overlay.show { display: block; }

    .main {
      flex: 1;
      margin-right: 260px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid #e7edf5;
      background: #ffffff;
    }
    body.dark-mode .navbar { background: #141a26; border-bottom-color: #2a3442; }
    .navbar h1 { font-size: 1.5rem; font-weight: 700; }
    .navbar-actions { display: flex; align-items: center; gap: 1.2rem; }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .navbar-actions button { color: #b0c0d4; }
    .navbar-actions button:hover { color: #2a7de1; }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: #2a7de1;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: #6b7d9c; }
    body.dark-mode .lang-dark .dark-toggle { color: #b0c0d4; }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .hamburger { color: #b0c0d4; }

    .chat-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .conversations-panel {
      width: 340px;
      border-left: 1px solid #e7edf5;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    body.dark-mode .conversations-panel { background: #1a1f2b; border-left-color: #2a3442; }
    .conversations-header {
      padding: 1rem;
      border-bottom: 1px solid #e7edf5;
    }
    body.dark-mode .conversations-header { border-bottom-color: #2a3442; }
    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border: 1.5px solid #dfe6f0;
      border-radius: 40px;
      font-size: 0.9rem;
      background: #f9fbfe;
      color: #1a253a;
    }
    body.dark-mode .search-box input { background: #252d3d; border-color: #3b465b; color: #eef2f6; }
    .search-box input:focus { outline: none; border-color: #2a7de1; box-shadow: 0 0 0 3px rgba(42,125,225,0.1); }
    .search-box i {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: #8a9bb5;
    }
    .conversations-list {
      flex: 1;
      overflow-y: auto;
    }
    .conversation-item {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #eef2f8;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    body.dark-mode .conversation-item { border-bottom-color: #2a3442; }
    .conversation-item:hover, .conversation-item.active {
      background: rgba(42,125,225,0.04);
    }
    .conversation-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2a7de1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .conversation-info { flex: 1; min-width: 0; }
    .conversation-name { font-weight: 600; font-size: 0.9rem; }
    .conversation-preview {
      font-size: 0.8rem;
      color: #8a9bb5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-meta { text-align: left; font-size: 0.7rem; color: #8a9bb5; }
    .unread-badge {
      background: #2a7de1;
      color: white;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      min-width: 20px;
      text-align: center;
      display: inline-block;
      margin-top: 4px;
    }
    .empty-conversations { padding: 2rem; text-align: center; color: #8a9bb5; }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f9fbfe;
    }
    body.dark-mode .chat-area { background: #1a1f2b; }
    .chat-header {
      padding: 0.8rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid #e7edf5;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    body.dark-mode .chat-header { background: #141a26; border-bottom-color: #2a3442; }
    .back-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: #8a9bb5;
      font-size: 1.2rem;
    }
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message-bubble {
      max-width: 70%;
      padding: 0.7rem 1rem;
      border-radius: 18px;
      position: relative;
      font-size: 0.9rem;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message-sent {
      align-self: flex-end;
      background: #2a7de1;
      color: white;
      border-bottom-left-radius: 4px;
    }
    .message-received {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #e7edf5;
      border-bottom-right-radius: 4px;
    }
    body.dark-mode .message-received { background: #252d3d; border-color: #3b465b; }
    .message-time {
      font-size: 0.65rem;
      opacity: 0.8;
      margin-top: 4px;
      display: block;
      text-align: left;
    }
    .chat-input {
      padding: 1rem;
      background: #ffffff;
      border-top: 1px solid #e7edf5;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    body.dark-mode .chat-input { background: #141a26; border-top-color: #2a3442; }
    .chat-input input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1.5px solid #dfe6f0;
      border-radius: 24px;
      font-size: 0.9rem;
      background: #f9fbfe;
      color: #1a253a;
    }
    body.dark-mode .chat-input input { background: #252d3d; border-color: #3b465b; color: #eef2f6; }
    .chat-input input:focus { outline: none; border-color: #2a7de1; }
    .no-chat-selected {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a9bb5;
      font-size: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-primary { background: #2a7de1; color: white; }
    .btn-primary:hover { background: #1a67c4; }
    .btn-secondary { background: #eef2f8; color: #1a253a; }
    .btn-secondary:hover { background: #dfe6f0; }
    body.dark-mode .btn-secondary { background: #2a3442; color: #eef2f6; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1.5rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #ffffff;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.3);
      position: relative;
    }
    body.dark-mode .modal { background: #1a1f2b; }
    .modal h2 { margin-bottom: 1.2rem; font-weight: 700; }
    .modal .form-group { margin-bottom: 1.2rem; }
    .modal .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    .modal .form-group input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #dfe6f0;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #f9fbfe;
    }
    body.dark-mode .modal .form-group input { background: #252d3d; border-color: #3b465b; color: #eef2f6; }
    .modal .form-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; justify-content: flex-end; }
    .modal .form-actions button {
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .modal .form-actions .cancel { background: #eef2f8; color: #1a253a; }
    .modal .form-actions .submit { background: #2a7de1; color: white; }

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-weight: 500;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast { background: #2a3442; color: #eef2f6; }
    .toast.success { border-right: 4px solid #10B981; }
    .toast.error { border-right: 4px solid #EF4444; }
    @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .main { margin-right: 0; }
      .sidebar { transform: translateX(100%); }
      .sidebar.closed { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .conversations-panel { width: 100%; display: block; }
      .chat-area { display: none; width: 100%; }
      .chat-area.active { display: flex; }
      .back-btn { display: block; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">لوحة التحكم</span></a>
      <a href="browse-teachers.html"><i class="fas fa-users"></i> <span data-key="teachers">المدرسون</span></a>
      <a href="my-courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">كورساتي</span></a>
      <a href="assignments.html"><i class="fas fa-tasks"></i> <span data-key="assignments">الواجبات</span></a>
      <a href="messages.html" class="active"><i class="fas fa-comments"></i> <span data-key="messages">الرسائل</span></a>
      <a href="profile.html"><i class="fas fa-user"></i> <span data-key="profile">الملف الشخصي</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">الإعدادات</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">تسجيل الخروج</span>
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">الرسائل</h1>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">AR</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="chat-container">
      <!-- لوحة المحادثات -->
      <div class="conversations-panel" id="conversationsPanel">
        <div class="conversations-header">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchConversation" placeholder="بحث في المحادثات...">
          </div>
          <button class="btn btn-primary" style="margin-top: 0.8rem; width: 100%;" id="newChatBtn">
            <i class="fas fa-plus"></i> محادثة جديدة
          </button>
        </div>
        <div class="conversations-list" id="conversationsList"></div>
      </div>

      <!-- منطقة الدردشة -->
      <div class="chat-area" id="chatArea">
        <div class="chat-header">
          <button class="back-btn" id="backToConversations"><i class="fas fa-arrow-right"></i></button>
          <div class="conversation-avatar" style="width: 36px; height: 36px;" id="chatAvatar">؟</div>
          <div>
            <div style="font-weight: 600;" id="chatName">اختر محادثة</div>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="no-chat-selected">← اختر محادثة من القائمة لبدء المراسلة</div>
        </div>
        <div class="chat-input">
          <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') document.getElementById('sendMessageBtn').click()">
          <button class="btn btn-primary" id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- مودال محادثة جديدة -->
  <div class="modal-overlay" id="newChatModal">
    <div class="modal">
      <button class="modal-close" style="position:absolute; top:1rem; left:1rem; background:none; border:none; color:#8a9bb5; cursor:pointer;" id="newChatModalClose"><i class="fas fa-times"></i></button>
      <h2>محادثة جديدة</h2>
      <div class="form-group">
        <label>معرف المعلم (Teacher ID)</label>
        <input type="text" id="newTeacherId" placeholder="أدخل معرف المعلم">
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="newChatCancel">إلغاء</button>
        <button class="btn btn-primary" id="startNewChatBtn">بدء المحادثة</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, updateDoc, doc, query, orderBy, onSnapshot, serverTimestamp, writeBatch
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOBJ22snwOow8xfQnL2WmCusmyS8iWWlk",
      authDomain: "educore-c3b42.firebaseapp.com",
      projectId: "educore-c3b42",
      storageBucket: "educore-c3b42.firebasestorage.app",
      messagingSenderId: "750509780814",
      appId: "1:750509780814:web:f57bddff39c7668b3cf81f",
      measurementId: "G-LF317C03Q0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let STUDENT_ID = '';
    let STUDENT_NAME = '';

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      else {
        currentUser = user;
        STUDENT_ID = user.uid;
        STUDENT_NAME = user.displayName || user.email || 'طالب';
        document.body.classList.add('auth-ready');
        listenToMessages();
      }
    });

    // Mobile sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => { if (window.innerWidth <= 768) { sidebar.classList.remove('open'); overlay.classList.remove('show'); } });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ========== المراسلة ==========
    let allMessages = [];
    let conversationsMap = new Map();
    let unreadCounts = new Map();
    let currentChatId = null;
    let currentChatName = '';

    function listenToMessages() {
      const q = query(collection(db, 'messages'), orderBy('timestamp', 'desc'));
      onSnapshot(q, (snapshot) => {
        allMessages = [];
        snapshot.forEach(doc => allMessages.push({ id: doc.id, ...doc.data() }));
        buildConversations();
      }, (error) => { console.error(error); showToast('فشل تحميل الرسائل', 'error'); });
    }

    function buildConversations() {
      conversationsMap.clear();
      unreadCounts.clear();

      allMessages.forEach(msg => {
        if (msg.senderId !== STUDENT_ID && msg.receiverId !== STUDENT_ID) return;
        const isStudentSender = msg.senderId === STUDENT_ID;
        const otherId = isStudentSender ? msg.receiverId : msg.senderId;
        const otherName = isStudentSender ? (msg.receiverName || otherId) : (msg.senderName || otherId);

        if (!conversationsMap.has(otherId)) {
          conversationsMap.set(otherId, { id: otherId, name: otherName, lastMessage: msg.text, lastTimestamp: msg.timestamp, unreadCount: 0 });
        } else {
          const conv = conversationsMap.get(otherId);
          if (msg.timestamp && (!conv.lastTimestamp || msg.timestamp > conv.lastTimestamp)) {
            conv.lastMessage = msg.text; conv.lastTimestamp = msg.timestamp;
          }
        }
        if (msg.receiverId === STUDENT_ID && msg.read === false) {
          unreadCounts.set(otherId, (unreadCounts.get(otherId) || 0) + 1);
        }
      });

      conversationsMap.forEach((conv, otherId) => { conv.unreadCount = unreadCounts.get(otherId) || 0; });
      renderConversations();
      if (currentChatId) renderChatMessages(currentChatId);
    }

    function renderConversations() {
      const container = document.getElementById('conversationsList');
      const searchTerm = document.getElementById('searchConversation').value.toLowerCase();
      const arr = Array.from(conversationsMap.values()).filter(c => c.name.toLowerCase().includes(searchTerm)).sort((a,b) => (b.lastTimestamp?.seconds || 0) - (a.lastTimestamp?.seconds || 0));
      if (!arr.length) { container.innerHTML = '<div class="empty-conversations">لا توجد محادثات</div>'; return; }
      container.innerHTML = arr.map(conv => {
        const timeStr = conv.lastTimestamp ? new Date(conv.lastTimestamp.seconds * 1000).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }) : '';
        const activeClass = currentChatId === conv.id ? 'active' : '';
        return `<div class="conversation-item ${activeClass}" data-chatid="${conv.id}" data-chatname="${escapeHtml(conv.name)}">
          <div class="conversation-avatar">${conv.name.charAt(0).toUpperCase()}</div>
          <div class="conversation-info"><div class="conversation-name">${escapeHtml(conv.name)}</div><div class="conversation-preview">${escapeHtml(conv.lastMessage||'')}</div></div>
          <div class="conversation-meta"><div>${timeStr}</div>${conv.unreadCount>0?`<span class="unread-badge">${conv.unreadCount}</span>`:''}</div>
        </div>`;
      }).join('');
      container.querySelectorAll('.conversation-item').forEach(item => item.addEventListener('click', () => selectConversation(item.dataset.chatid, item.dataset.chatname)));
    }

    document.getElementById('searchConversation').addEventListener('input', renderConversations);

    function selectConversation(chatId, chatName) {
      currentChatId = chatId; currentChatName = chatName;
      document.getElementById('chatAvatar').textContent = chatName.charAt(0).toUpperCase();
      document.getElementById('chatName').textContent = chatName;
      renderChatMessages(chatId); markMessagesAsRead(chatId);
      if (window.innerWidth <= 768) { document.getElementById('conversationsPanel').style.display = 'none'; document.getElementById('chatArea').classList.add('active'); }
    }

    document.getElementById('backToConversations').addEventListener('click', () => {
      if (window.innerWidth <= 768) { document.getElementById('conversationsPanel').style.display = 'block'; document.getElementById('chatArea').classList.remove('active'); }
    });

    async function markMessagesAsRead(chatId) {
      const batch = writeBatch(db);
      allMessages.filter(m => m.receiverId === STUDENT_ID && m.senderId === chatId && m.read === false).forEach(m => batch.update(doc(db, 'messages', m.id), { read: true }));
      try { await batch.commit(); } catch (e) { console.error(e); }
    }

    function renderChatMessages(chatId) {
      const container = document.getElementById('chatMessages');
      const msgs = allMessages.filter(m => (m.senderId===chatId && m.receiverId===STUDENT_ID) || (m.senderId===STUDENT_ID && m.receiverId===chatId)).sort((a,b) => (a.timestamp?.seconds||0)-(b.timestamp?.seconds||0));
      if (!msgs.length) { container.innerHTML = '<div class="no-chat-selected">لا توجد رسائل بعد. ابدأ المحادثة!</div>'; return; }
      container.innerHTML = msgs.map(m => {
        const isSent = m.senderId === STUDENT_ID;
        const timeStr = m.timestamp ? new Date(m.timestamp.seconds*1000).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : '';
        return `<div class="message-bubble ${isSent?'message-sent':'message-received'}">${escapeHtml(m.text)}<span class="message-time">${timeStr}</span></div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('sendMessageBtn').addEventListener('click', async () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;
      try {
        await addDoc(collection(db, 'messages'), { senderId: STUDENT_ID, senderName: STUDENT_NAME, receiverId: currentChatId, receiverName: currentChatName, text, timestamp: serverTimestamp(), read: false });
        input.value = '';
      } catch (e) { showToast('فشل إرسال الرسالة', 'error'); }
    });

    // محادثة جديدة
    document.getElementById('newChatBtn').addEventListener('click', () => document.getElementById('newChatModal').classList.add('active'));
    document.getElementById('newChatModalClose').addEventListener('click', () => document.getElementById('newChatModal').classList.remove('active'));
    document.getElementById('newChatCancel').addEventListener('click', () => document.getElementById('newChatModal').classList.remove('active'));
    document.getElementById('startNewChatBtn').addEventListener('click', async () => {
      const teacherId = document.getElementById('newTeacherId').value.trim();
      if (!teacherId) { showToast('أدخل معرف المعلم', 'error'); return; }
      // جلب اسم المعلم
      let teacherName = teacherId;
      try {
        const prefsDoc = await getDoc(doc(db, 'teachers', teacherId, 'settings', 'preferences'));
        if (prefsDoc.exists()) teacherName = prefsDoc.data().name || teacherId;
      } catch(e) {}
      document.getElementById('newChatModal').classList.remove('active');
      document.getElementById('newTeacherId').value = '';
      selectConversation(teacherId, teacherName);
    });
    document.getElementById('newChatModal').addEventListener('click', (e) => { if (e.target === document.getElementById('newChatModal')) document.getElementById('newChatModal').classList.remove('active'); });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    // اللغة والوضع الليلي
    let lang = 'ar';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');

    const translations = {
      ar: { dashboard: 'لوحة التحكم', teachers: 'المدرسون', courses: 'كورساتي', assignments: 'الواجبات', messages: 'الرسائل', profile: 'الملف الشخصي', settings: 'الإعدادات', logout: 'تسجيل الخروج', pageTitle: 'الرسائل' },
      en: { dashboard: 'Dashboard', teachers: 'Teachers', courses: 'My Courses', assignments: 'Assignments', messages: 'Messages', profile: 'Profile', settings: 'Settings', logout: 'Logout', pageTitle: 'Messages' }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      darkToggle.innerHTML = document.body.classList.contains('dark-mode') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    applyLanguage('ar');
    console.log('✅ صفحة الرسائل جاهزة.');
  </script>
</body>
</html>
